<svg xmlns="http://www.w3.org/2000/svg" width="540" height="231" viewBox="0 0 540 231"><title>图表</title><rect width="540" height="231" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">图表</text><rect x="16" y="39" width="245" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">创建图表：先选数据源，再在“</text><text x="27" y="81" font-size="15" font-weight="400">插入</text><text x="262" y="62" font-size="14" font-weight="700">→</text><rect x="279" y="39" width="245" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="290" y="61" font-size="15" font-weight="400">图表”选择类型和子类型</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">按 F11 可在新工作表中创建默认图表</text><text x="16" y="171" font-size="13" font-weight="700">本组例子</text><rect x="16" y="181" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="203" font-size="15" font-weight="400">月份放横轴，销量放纵轴</text><text x="263" y="204" font-size="14" font-weight="700">→</text><rect x="280" y="181" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="203" font-size="15" font-weight="400">用折线图看趋势</text></g></svg>