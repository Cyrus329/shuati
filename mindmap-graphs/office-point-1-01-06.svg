<svg xmlns="http://www.w3.org/2000/svg" width="540" height="278" viewBox="0 0 540 278"><title>文件格式、窗口与视图</title><rect width="540" height="278" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文件格式、窗口与视图</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">快速访问工具栏便于执行保存、撤销、恢复等常用操作，可自定义添</text><text x="27" y="81" font-size="15" font-weight="400">加或隐藏图标</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">文档可开多个窗口</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">新建窗口是同一文档的另一个视角，不等于另存一份文件</text><text x="16" y="218" font-size="13" font-weight="700">本组例子</text><rect x="16" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="250" font-size="15" font-weight="400">论文.docx</text><text x="175" y="251" font-size="14" font-weight="700">→</text><rect x="192" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="250" font-size="15" font-weight="400">打开 Word</text><text x="351" y="251" font-size="14" font-weight="700">→</text><rect x="368" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="250" font-size="15" font-weight="400">在页面上编辑</text></g></svg>