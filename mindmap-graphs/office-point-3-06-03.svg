<svg xmlns="http://www.w3.org/2000/svg" width="540" height="372" viewBox="0 0 540 372"><title>综合易混点与操作路径</title><rect width="540" height="372" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">综合易混点与操作路径</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">做路径题时先抓选项卡</text><text x="27" y="78" font-size="15" font-weight="400">母版在“视图”</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">主题背景在“设计”</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">动画在“动画”</text><rect x="16" y="200" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="222" font-size="15" font-weight="400">放映在“幻灯片放映”</text><rect x="16" y="247" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="269" font-size="15" font-weight="400">链接和动作在“插入”</text><text x="16" y="312" font-size="13" font-weight="700">本组例子</text><rect x="16" y="322" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="344" font-size="15" font-weight="400">想统一多页版式找母版</text><text x="263" y="345" font-size="14" font-weight="700">→</text><rect x="280" y="322" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="344" font-size="15" font-weight="400">想改页面交接找切换</text></g></svg>