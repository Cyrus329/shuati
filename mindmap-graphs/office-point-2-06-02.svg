<svg xmlns="http://www.w3.org/2000/svg" width="540" height="211" viewBox="0 0 540 211"><title>自动填充</title><rect width="540" height="211" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">自动填充</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">单个数值直接拖动通常是复制，按 Ctrl 拖动则递增</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">文本型数字的效果相反</text><text x="16" y="151" font-size="13" font-weight="700">本组例子</text><rect x="16" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="183" font-size="15" font-weight="400">填入 1 和 2</text><text x="175" y="184" font-size="14" font-weight="700">→</text><rect x="192" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="183" font-size="15" font-weight="400">选中两格向下拖</text><text x="351" y="184" font-size="14" font-weight="700">→</text><rect x="368" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="183" font-size="15" font-weight="400">3、4、5</text></g></svg>