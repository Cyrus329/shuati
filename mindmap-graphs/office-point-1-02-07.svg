<svg xmlns="http://www.w3.org/2000/svg" width="540" height="258" viewBox="0 0 540 258"><title>新建、保存、保护与打印</title><rect width="540" height="258" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">新建、保存、保护与打印</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">打印前检查打印机、纸张、方向、页边距、份数和页码范围</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">在页码框输入1-5,12，表示打印第1—5页和第12页</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">逗号分隔不连续页段，连字符表示连续页段</text><text x="16" y="198" font-size="13" font-weight="700">本组例子</text><rect x="16" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="230" font-size="15" font-weight="400">原稿.docx</text><text x="175" y="231" font-size="14" font-weight="700">→</text><rect x="192" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="230" font-size="15" font-weight="400">另存为</text><text x="351" y="231" font-size="14" font-weight="700">→</text><rect x="368" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="230" font-size="15" font-weight="400">修改稿.docx</text></g></svg>