<svg xmlns="http://www.w3.org/2000/svg" width="540" height="211" viewBox="0 0 540 211"><title>单元格格式</title><rect width="540" height="211" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">单元格格式</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">单元格格式包括数字格式、对齐、字体、边框、填充和保护</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">条件格式会按条件动态改变显示</text><text x="16" y="151" font-size="13" font-weight="700">本组例子</text><rect x="16" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="183" font-size="15" font-weight="400">输入 0.25</text><text x="175" y="184" font-size="14" font-weight="700">→</text><rect x="192" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="183" font-size="15" font-weight="400">百分比格式</text><text x="351" y="184" font-size="14" font-weight="700">→</text><rect x="368" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="183" font-size="15" font-weight="400">显示为 25%</text></g></svg>