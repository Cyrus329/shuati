<svg xmlns="http://www.w3.org/2000/svg" width="540" height="466" viewBox="0 0 540 466"><title>文本输入、选择、编辑与查找替换</title><rect width="540" height="466" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文本输入、选择、编辑与查找替换</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">正文编辑区</text><text x="27" y="78" font-size="15" font-weight="400">拖动选择连续内容</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">双击选一个单词</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">三击选一段</text><rect x="16" y="200" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="222" font-size="15" font-weight="400">Ctrl+单击选一句</text><rect x="16" y="247" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="269" font-size="15" font-weight="400">Ctrl+A选全文</text><rect x="16" y="294" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="316" font-size="15" font-weight="400">Alt+拖动可选择跨行矩形区域</text><rect x="16" y="341" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="363" font-size="15" font-weight="400">按Ctrl可添加不连续选择</text><text x="16" y="406" font-size="13" font-weight="700">本组例子</text><rect x="16" y="416" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="438" font-size="15" font-weight="400">「甲｜丙」插入乙</text><text x="263" y="439" font-size="14" font-weight="700">→</text><rect x="280" y="416" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="438" font-size="15" font-weight="400">「甲乙｜丙」</text></g></svg>