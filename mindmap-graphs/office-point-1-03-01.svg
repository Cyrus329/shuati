<svg xmlns="http://www.w3.org/2000/svg" width="540" height="231" viewBox="0 0 540 231"><title>文本输入、选择、编辑与查找替换</title><rect width="540" height="231" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文本输入、选择、编辑与查找替换</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">输入可通过键盘、插入现有文件、语音或手写等方式完成</text><rect x="16" y="86" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">插入现有文件的课</text><text x="27" y="128" font-size="15" font-weight="400">程路径是插入</text><text x="174" y="109" font-size="14" font-weight="700">→</text><rect x="191" y="86" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="108" font-size="15" font-weight="400">文本</text><text x="349" y="109" font-size="14" font-weight="700">→</text><rect x="366" y="86" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="108" font-size="15" font-weight="400">对象下拉列表</text><text x="16" y="171" font-size="13" font-weight="700">本组例子</text><rect x="16" y="181" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="203" font-size="15" font-weight="400">「甲｜丙」插入乙</text><text x="263" y="204" font-size="14" font-weight="700">→</text><rect x="280" y="181" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="203" font-size="15" font-weight="400">「甲乙｜丙」</text></g></svg>