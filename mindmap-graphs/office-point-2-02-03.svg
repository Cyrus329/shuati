<svg xmlns="http://www.w3.org/2000/svg" width="540" height="184" viewBox="0 0 540 184"><title>工作簿、工作表与单元格</title><rect width="540" height="184" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">工作簿、工作表与单元格</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">Excel 2010 以后每张工作表最多有 2^20＝1,048,576 行、2^14＝</text><text x="27" y="81" font-size="15" font-weight="400">16,384 列，最后一列为 XFD</text><text x="16" y="124" font-size="13" font-weight="700">本组例子</text><rect x="16" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="156" font-size="15" font-weight="400">成绩.xlsx</text><text x="175" y="157" font-size="14" font-weight="700">→</text><rect x="192" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="156" font-size="15" font-weight="400">期中成绩工作表</text><text x="351" y="157" font-size="14" font-weight="700">→</text><rect x="368" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="156" font-size="15" font-weight="400">B2 单元格</text></g></svg>