<svg xmlns="http://www.w3.org/2000/svg" width="540" height="278" viewBox="0 0 540 278"><title>页面、分栏、分节、页眉页脚与页码</title><rect width="540" height="278" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">页面、分栏、分节、页眉页脚与页码</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">分页符只分页面，分节符划分格式范围</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">“下一页分节符”同时起分节与换页作用</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">删除分节符可能改变相邻内容的页面格式，要检查实际结果</text><text x="16" y="198" font-size="13" font-weight="700">本组例子</text><rect x="16" y="208" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="230" font-size="15" font-weight="400">第 1 节用纵向纸</text><text x="27" y="250" font-size="15" font-weight="400">张</text><text x="175" y="231" font-size="14" font-weight="700">→</text><rect x="192" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="230" font-size="15" font-weight="400">下一页分节</text><text x="351" y="231" font-size="14" font-weight="700">→</text><rect x="368" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="230" font-size="15" font-weight="400">第 2 节用横向</text></g></svg>