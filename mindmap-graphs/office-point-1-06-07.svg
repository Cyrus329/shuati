<svg xmlns="http://www.w3.org/2000/svg" width="540" height="278" viewBox="0 0 540 278"><title>Word 表格、公式与排序</title><rect width="540" height="278" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">Word 表格、公式与排序</text><rect x="16" y="39" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">Word表格可通过布</text><text x="27" y="81" font-size="15" font-weight="400">局</text><text x="174" y="62" font-size="14" font-weight="700">→</text><rect x="191" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="61" font-size="15" font-weight="400">数据</text><text x="349" y="62" font-size="14" font-weight="700">→</text><rect x="366" y="39" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="61" font-size="15" font-weight="400">公式使用SUM、</text><text x="377" y="81" font-size="15" font-weight="400">AVERAGE等函数</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">计算结果是域，需要在数据变化后更新</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">不能把Word表格视为具有Excel同样完整的自动重算机制</text><text x="16" y="218" font-size="13" font-weight="700">本组例子</text><rect x="16" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="250" font-size="15" font-weight="400">姓名、分数</text><text x="175" y="251" font-size="14" font-weight="700">→</text><rect x="192" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="250" font-size="15" font-weight="400">两列表格</text><text x="351" y="251" font-size="14" font-weight="700">→</text><rect x="368" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="250" font-size="15" font-weight="400">按分数降序</text></g></svg>