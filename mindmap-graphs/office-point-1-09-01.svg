<svg xmlns="http://www.w3.org/2000/svg" width="540" height="251" viewBox="0 0 540 251"><title>邮件合并、数据源与合并域</title><rect width="540" height="251" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">邮件合并、数据源与合并域</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">邮件合并适用于通知、成绩单、信封、标签等：大部分格式与文字相</text><text x="27" y="81" font-size="15" font-weight="400">同，姓名、成绩、地址等变量不同</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">它不限定于通过电子邮件发送，也可输出批量文档或打印</text><text x="16" y="171" font-size="13" font-weight="700">本组例子</text><rect x="16" y="181" width="244" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="203" font-size="15" font-weight="400">一张通知模板 + 多行收件人名</text><text x="27" y="223" font-size="15" font-weight="400">单</text><text x="263" y="204" font-size="14" font-weight="700">→</text><rect x="280" y="181" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="203" font-size="15" font-weight="400">每人一份通知</text></g></svg>