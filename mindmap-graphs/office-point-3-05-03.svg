<svg xmlns="http://www.w3.org/2000/svg" width="540" height="258" viewBox="0 0 540 258"><title>幻灯片放映、计时与录制</title><rect width="540" height="258" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">幻灯片放映、计时与录制</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">放映方式还包括自定义放映、排练计时、录制</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">排练计时记录每张幻灯片放映时间</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">录制除时间外还记录旁白、墨迹和激光笔手势</text><text x="16" y="198" font-size="13" font-weight="700">本组例子</text><rect x="16" y="208" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="230" font-size="15" font-weight="400">排练计时记录每页停留时长</text><text x="263" y="231" font-size="14" font-weight="700">→</text><rect x="280" y="208" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="230" font-size="15" font-weight="400">放映时可使用计时</text></g></svg>