<svg xmlns="http://www.w3.org/2000/svg" width="540" height="231" viewBox="0 0 540 231"><title>字符和段落格式、样式与模板</title><rect width="540" height="231" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">字符和段落格式、样式与模板</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">开始→字体组或字体对话框可设置字体、字号、字形、颜色、上下标、</text><text x="27" y="81" font-size="15" font-weight="400">下划线、删除线、字符间距和缩放等</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">字体决定字形设计，字号决定字符大小，加粗／倾斜是字形效果</text><text x="16" y="171" font-size="13" font-weight="700">本组例子</text><rect x="16" y="181" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="203" font-size="15" font-weight="400">把「第一章」应用标题 1</text><text x="263" y="204" font-size="14" font-weight="700">→</text><rect x="280" y="181" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="203" font-size="15" font-weight="400">同时统一字号和层级</text></g></svg>