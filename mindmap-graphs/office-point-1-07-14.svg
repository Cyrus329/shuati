<svg xmlns="http://www.w3.org/2000/svg" width="540" height="251" viewBox="0 0 540 251"><title>图片、形状、图表与文字环绕</title><rect width="540" height="251" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">图片、形状、图表与文字环绕</text><rect x="16" y="39" width="87" height="80" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">入口：选</text><text x="27" y="81" font-size="15" font-weight="400">中图片／</text><text x="27" y="101" font-size="15" font-weight="400">形状</text><text x="104" y="62" font-size="14" font-weight="700">→</text><rect x="121" y="39" width="87" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="132" y="61" font-size="15" font-weight="400">格式</text><text x="209" y="62" font-size="14" font-weight="700">→</text><rect x="226" y="39" width="87" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="237" y="61" font-size="15" font-weight="400">环绕文字</text><text x="237" y="81" font-size="15" font-weight="400">，或右键</text><text x="314" y="62" font-size="14" font-weight="700">→</text><rect x="331" y="39" width="87" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="342" y="61" font-size="15" font-weight="400">其他布局</text><text x="342" y="81" font-size="15" font-weight="400">选项</text><text x="419" y="62" font-size="14" font-weight="700">→</text><rect x="436" y="39" width="87" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="447" y="61" font-size="15" font-weight="400">文字环绕</text><rect x="16" y="126" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="148" font-size="15" font-weight="400">完成后检查对象位置、段落流动及打印预览</text><text x="16" y="191" font-size="13" font-weight="700">本组例子</text><rect x="16" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="223" font-size="15" font-weight="400">插入图片</text><text x="175" y="224" font-size="14" font-weight="700">→</text><rect x="192" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="223" font-size="15" font-weight="400">选择四周型</text><text x="351" y="224" font-size="14" font-weight="700">→</text><rect x="368" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="223" font-size="15" font-weight="400">正文绕到图片两侧</text></g></svg>