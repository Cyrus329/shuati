<svg xmlns="http://www.w3.org/2000/svg" width="540" height="325" viewBox="0 0 540 325"><title>PowerPoint 基础、文件格式与视图</title><rect width="540" height="325" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">PowerPoint 基础、文件格式与视图</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">普通视图最适合编辑每张幻灯片</text><rect x="16" y="86" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">幻灯片浏览视图可批量浏览、复制、移动、删除和调整顺序，不能编</text><text x="27" y="128" font-size="15" font-weight="400">辑内容</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">阅读视图非全屏预览</text><rect x="16" y="200" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="222" font-size="15" font-weight="400">放映视图全屏且不可修改</text><text x="16" y="265" font-size="13" font-weight="700">本组例子</text><rect x="16" y="275" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="297" font-size="15" font-weight="400">普通视图编辑单页</text><text x="263" y="298" font-size="14" font-weight="700">→</text><rect x="280" y="275" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="297" font-size="15" font-weight="400">幻灯片浏览视图查看整套顺序</text></g></svg>