<svg xmlns="http://www.w3.org/2000/svg" width="540" height="271" viewBox="0 0 540 271"><title>页面、分栏、分节、页眉页脚与页码</title><rect width="540" height="271" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">页面、分栏、分节、页眉页脚与页码</text><rect x="16" y="39" width="245" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">插入</text><text x="262" y="62" font-size="14" font-weight="700">→</text><rect x="279" y="39" width="245" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="290" y="61" font-size="15" font-weight="400">页眉和页脚组可设置页眉、页</text><text x="290" y="81" font-size="15" font-weight="400">脚和页码</text><rect x="16" y="106" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">页眉位于页面顶部，页脚位于底部，可包含文字、图形、文件名、日</text><text x="27" y="148" font-size="15" font-weight="400">期、章节名、单位徽标或域</text><text x="16" y="191" font-size="13" font-weight="700">本组例子</text><rect x="16" y="201" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="223" font-size="15" font-weight="400">第 1 节用纵向纸</text><text x="27" y="243" font-size="15" font-weight="400">张</text><text x="175" y="224" font-size="14" font-weight="700">→</text><rect x="192" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="223" font-size="15" font-weight="400">下一页分节</text><text x="351" y="224" font-size="14" font-weight="700">→</text><rect x="368" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="223" font-size="15" font-weight="400">第 2 节用横向</text></g></svg>