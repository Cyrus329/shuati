<svg xmlns="http://www.w3.org/2000/svg" width="540" height="211" viewBox="0 0 540 211"><title>幻灯片切换与对象动画</title><rect width="540" height="211" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">幻灯片切换与对象动画</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">动画作用对象是幻灯片内的文本、图片、表格、图标等对象</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">预设动画有进入、强调、退出、动作路径四类</text><text x="16" y="151" font-size="13" font-weight="700">本组例子</text><rect x="16" y="161" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="183" font-size="15" font-weight="400">翻到下一页是切换</text><text x="263" y="184" font-size="14" font-weight="700">→</text><rect x="280" y="161" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="183" font-size="15" font-weight="400">让本页标题飞入是动画</text></g></svg>