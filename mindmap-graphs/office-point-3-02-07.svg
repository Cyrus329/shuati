<svg xmlns="http://www.w3.org/2000/svg" width="540" height="298" viewBox="0 0 540 298"><title>插入媒体、交互动作与页眉页脚</title><rect width="540" height="298" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">插入媒体、交互动作与页眉页脚</text><rect x="16" y="39" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">页眉页脚路径：[</text><text x="27" y="81" font-size="15" font-weight="400">插入]</text><text x="174" y="62" font-size="14" font-weight="700">→</text><rect x="191" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="61" font-size="15" font-weight="400">[文本]</text><text x="349" y="62" font-size="14" font-weight="700">→</text><rect x="366" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="61" font-size="15" font-weight="400">[页眉和页脚]</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">“应用”只作用于本张，“全部应用”作用于所有幻灯片</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">可设置日期时间和幻灯片编号</text><text x="16" y="218" font-size="13" font-weight="700">本组例子</text><rect x="16" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="250" font-size="15" font-weight="400">选中按钮</text><text x="175" y="251" font-size="14" font-weight="700">→</text><rect x="192" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="250" font-size="15" font-weight="400">添加链接</text><text x="351" y="251" font-size="14" font-weight="700">→</text><rect x="368" y="228" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="250" font-size="15" font-weight="400">放映时跳到指定幻</text><text x="379" y="270" font-size="15" font-weight="400">灯片</text></g></svg>