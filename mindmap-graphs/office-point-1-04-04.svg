<svg xmlns="http://www.w3.org/2000/svg" width="540" height="278" viewBox="0 0 540 278"><title>字符和段落格式、样式与模板</title><rect width="540" height="278" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">字符和段落格式、样式与模板</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">模板提供新文档的框架和样式组合，可用于信封、证书、奖状、名片</text><text x="27" y="81" font-size="15" font-weight="400">等</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">模板在新建文档时套用</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">样式在文档内部复用，二者不能混为一谈</text><text x="16" y="218" font-size="13" font-weight="700">本组例子</text><rect x="16" y="228" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="250" font-size="15" font-weight="400">把「第一章」应用标题 1</text><text x="263" y="251" font-size="14" font-weight="700">→</text><rect x="280" y="228" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="250" font-size="15" font-weight="400">同时统一字号和层级</text></g></svg>