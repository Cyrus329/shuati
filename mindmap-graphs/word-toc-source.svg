<svg xmlns="http://www.w3.org/2000/svg" width="540" height="181" viewBox="0 0 540 181"><title>目录从哪里取标题</title><rect width="540" height="181" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="18" y="28" font-size="19" font-weight="700">目录从哪里取标题</text><text x="26" y="56" font-size="15" font-weight="700">正文里的文字</text><text x="296" y="56" font-size="15" font-weight="700">自动目录里的结果</text><rect x="16" y="66" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="66" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="86" font-size="15" font-weight="400">第 1 章 计算机基础 · 标题 1</text><text x="255" y="86" font-size="18" font-weight="400">→</text><text x="296" y="86" font-size="15" font-weight="400">第 1 章 计算机基础 …… 1</text><rect x="16" y="101" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="101" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="121" font-size="15" font-weight="400">1.1 计算机文化 · 标题 2</text><text x="255" y="121" font-size="18" font-weight="400">→</text><text x="296" y="121" font-size="15" font-weight="400">　1.1 计算机文化 …… 2</text><rect x="16" y="136" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="136" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="156" font-size="15" font-weight="400">复习提示 · 仅加粗、放大</text><text x="255" y="156" font-size="18" font-weight="400">→</text><text x="296" y="156" font-size="15" font-weight="400">不进入目录</text></g></svg>