<svg xmlns="http://www.w3.org/2000/svg" width="540" height="204" viewBox="0 0 540 204"><title>宏</title><rect width="540" height="204" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">宏</text><rect x="16" y="39" width="113" height="80" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">录制宏前先</text><text x="27" y="81" font-size="15" font-weight="400">启用“开发工</text><text x="27" y="101" font-size="15" font-weight="400">具”：文件</text><text x="130" y="62" font-size="14" font-weight="700">→</text><rect x="147" y="39" width="113" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="158" y="61" font-size="15" font-weight="400">选项</text><text x="261" y="62" font-size="14" font-weight="700">→</text><rect x="278" y="39" width="113" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="289" y="61" font-size="15" font-weight="400">自定义功能</text><text x="289" y="81" font-size="15" font-weight="400">区</text><text x="392" y="62" font-size="14" font-weight="700">→</text><rect x="409" y="39" width="113" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="420" y="61" font-size="15" font-weight="400">勾选“开发工</text><text x="420" y="81" font-size="15" font-weight="400">具”</text><text x="16" y="144" font-size="13" font-weight="700">本组例子</text><rect x="16" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="176" font-size="15" font-weight="400">录制固定格式操作</text><text x="175" y="177" font-size="14" font-weight="700">→</text><rect x="192" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="176" font-size="15" font-weight="400">停止录制</text><text x="351" y="177" font-size="14" font-weight="700">→</text><rect x="368" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="176" font-size="15" font-weight="400">运行宏</text></g></svg>