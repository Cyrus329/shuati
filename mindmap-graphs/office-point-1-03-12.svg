<svg xmlns="http://www.w3.org/2000/svg" width="540" height="278" viewBox="0 0 540 278"><title>文本输入、选择、编辑与查找替换</title><rect width="540" height="278" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文本输入、选择、编辑与查找替换</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">Ctrl+F查找，Ctrl+H替换，Ctrl+G或F5定位</text><rect x="16" y="86" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">查找和替换可以针对文字、格式、特殊字符，也可结合通配符批量操</text><text x="27" y="128" font-size="15" font-weight="400">作</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">定位可按页、节、行、域、表格、公式或图形等目标跳转</text><text x="16" y="218" font-size="13" font-weight="700">本组例子</text><rect x="16" y="228" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="250" font-size="15" font-weight="400">「甲｜丙」插入乙</text><text x="263" y="251" font-size="14" font-weight="700">→</text><rect x="280" y="228" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="250" font-size="15" font-weight="400">「甲乙｜丙」</text></g></svg>