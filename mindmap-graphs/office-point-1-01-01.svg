<svg xmlns="http://www.w3.org/2000/svg" width="540" height="325" viewBox="0 0 540 325"><title>文件格式、窗口与视图</title><rect width="540" height="325" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文件格式、窗口与视图</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">字处理软件用于文字输入、编辑、格式化、表格与图形处理、打印输</text><text x="27" y="81" font-size="15" font-weight="400">出</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">常用办公软件包包括Microsoft Office和WPS Office</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">WPS文字传统扩展名为.wps</text><rect x="16" y="200" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="222" font-size="15" font-weight="400">Adobe InDesign用于文字和版面排版</text><text x="16" y="265" font-size="13" font-weight="700">本组例子</text><rect x="16" y="275" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="297" font-size="15" font-weight="400">论文.docx</text><text x="175" y="298" font-size="14" font-weight="700">→</text><rect x="192" y="275" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="297" font-size="15" font-weight="400">打开 Word</text><text x="351" y="298" font-size="14" font-weight="700">→</text><rect x="368" y="275" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="297" font-size="15" font-weight="400">在页面上编辑</text></g></svg>