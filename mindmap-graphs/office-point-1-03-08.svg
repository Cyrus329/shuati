<svg xmlns="http://www.w3.org/2000/svg" width="540" height="278" viewBox="0 0 540 278"><title>文本输入、选择、编辑与查找替换</title><rect width="540" height="278" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文本输入、选择、编辑与查找替换</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">开始→剪贴板组</text><text x="27" y="78" font-size="15" font-weight="400">Ctrl+C复制，Ctrl+X剪切，Ctrl+V粘贴</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">Office剪贴板可保存最多24个项目</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">最近复制的项目显示在最上方，普通粘贴通常使用最近一个项目</text><text x="16" y="218" font-size="13" font-weight="700">本组例子</text><rect x="16" y="228" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="250" font-size="15" font-weight="400">「甲｜丙」插入乙</text><text x="263" y="251" font-size="14" font-weight="700">→</text><rect x="280" y="228" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="250" font-size="15" font-weight="400">「甲乙｜丙」</text></g></svg>