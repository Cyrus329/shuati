<svg xmlns="http://www.w3.org/2000/svg" width="540" height="164" viewBox="0 0 540 164"><title>数据类型</title><rect width="540" height="164" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">数据类型</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">Excel 单元格主要有数值型、文本型、日期/时间型和逻辑型四类数据</text><text x="16" y="104" font-size="13" font-weight="700">本组例子</text><rect x="16" y="114" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="136" font-size="15" font-weight="400">输入 00123</text><text x="175" y="137" font-size="14" font-weight="700">→</text><rect x="192" y="114" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="136" font-size="15" font-weight="400">先设置文本格式</text><text x="351" y="137" font-size="14" font-weight="700">→</text><rect x="368" y="114" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="136" font-size="15" font-weight="400">保留前导零</text></g></svg>