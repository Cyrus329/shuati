<svg xmlns="http://www.w3.org/2000/svg" width="540" height="278" viewBox="0 0 540 278"><title>新建、保存、保护与打印</title><rect width="540" height="278" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">新建、保存、保护与打印</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">文档有未保存更改时，关闭通常会提示是否保存</text><rect x="16" y="86" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">课程的“文件→选项→保存”涉及自动恢复信息的保存间隔，常见默认10</text><text x="27" y="128" font-size="15" font-weight="400">分钟</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">自动恢复信息不能等同于已手动保存全部修改</text><text x="16" y="218" font-size="13" font-weight="700">本组例子</text><rect x="16" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="250" font-size="15" font-weight="400">原稿.docx</text><text x="175" y="251" font-size="14" font-weight="700">→</text><rect x="192" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="250" font-size="15" font-weight="400">另存为</text><text x="351" y="251" font-size="14" font-weight="700">→</text><rect x="368" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="250" font-size="15" font-weight="400">修改稿.docx</text></g></svg>