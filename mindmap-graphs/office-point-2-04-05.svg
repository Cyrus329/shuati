<svg xmlns="http://www.w3.org/2000/svg" width="540" height="204" viewBox="0 0 540 204"><title>宏</title><rect width="540" height="204" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">宏</text><rect x="16" y="39" width="508" height="80" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">录制宏</text><text x="27" y="78" font-size="15" font-weight="400">开发工具→代码→录制宏，填写宏名、快捷键和保存位置，执行操作后</text><text x="27" y="98" font-size="15" font-weight="400">点击“停止录制”</text><text x="16" y="144" font-size="13" font-weight="700">本组例子</text><rect x="16" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="176" font-size="15" font-weight="400">录制固定格式操作</text><text x="175" y="177" font-size="14" font-weight="700">→</text><rect x="192" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="176" font-size="15" font-weight="400">停止录制</text><text x="351" y="177" font-size="14" font-weight="700">→</text><rect x="368" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="176" font-size="15" font-weight="400">运行宏</text></g></svg>