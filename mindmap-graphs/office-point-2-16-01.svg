<svg xmlns="http://www.w3.org/2000/svg" width="540" height="211" viewBox="0 0 540 211"><title>图表</title><rect width="540" height="211" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">图表</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">图表与源数据关联，源数据改变时图表会自动更新</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">常见组成包括图表区、绘图区、坐标轴、图例和数据系列</text><text x="16" y="151" font-size="13" font-weight="700">本组例子</text><rect x="16" y="161" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="183" font-size="15" font-weight="400">月份放横轴，销量放纵轴</text><text x="263" y="184" font-size="14" font-weight="700">→</text><rect x="280" y="161" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="183" font-size="15" font-weight="400">用折线图看趋势</text></g></svg>