<svg xmlns="http://www.w3.org/2000/svg" width="540" height="184" viewBox="0 0 540 184"><title>自动填充</title><rect width="540" height="184" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">自动填充</text><rect x="16" y="39" width="113" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">自定义序列</text><text x="27" y="81" font-size="15" font-weight="400">路径：文件</text><text x="130" y="62" font-size="14" font-weight="700">→</text><rect x="147" y="39" width="113" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="158" y="61" font-size="15" font-weight="400">选项</text><text x="261" y="62" font-size="14" font-weight="700">→</text><rect x="278" y="39" width="113" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="289" y="61" font-size="15" font-weight="400">高级</text><text x="392" y="62" font-size="14" font-weight="700">→</text><rect x="409" y="39" width="113" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="420" y="61" font-size="15" font-weight="400">编辑自定义</text><text x="420" y="81" font-size="15" font-weight="400">列表</text><text x="16" y="124" font-size="13" font-weight="700">本组例子</text><rect x="16" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="156" font-size="15" font-weight="400">填入 1 和 2</text><text x="175" y="157" font-size="14" font-weight="700">→</text><rect x="192" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="156" font-size="15" font-weight="400">选中两格向下拖</text><text x="351" y="157" font-size="14" font-weight="700">→</text><rect x="368" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="156" font-size="15" font-weight="400">3、4、5</text></g></svg>