<svg xmlns="http://www.w3.org/2000/svg" width="540" height="305" viewBox="0 0 540 305"><title>文件格式、窗口与视图</title><rect width="540" height="305" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文件格式、窗口与视图</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">选项卡和功能区替代传统菜单栏、工具栏</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">功能区按任务分为组，组中放命令</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">某些组右下角的对话框启动器打开更多设置</text><rect x="16" y="180" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="202" font-size="15" font-weight="400">选中表格、图片、形状等对象时才出现相应的上下文工具选项卡</text><text x="16" y="245" font-size="13" font-weight="700">本组例子</text><rect x="16" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="277" font-size="15" font-weight="400">论文.docx</text><text x="175" y="278" font-size="14" font-weight="700">→</text><rect x="192" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="277" font-size="15" font-weight="400">打开 Word</text><text x="351" y="278" font-size="14" font-weight="700">→</text><rect x="368" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="277" font-size="15" font-weight="400">在页面上编辑</text></g></svg>