<svg xmlns="http://www.w3.org/2000/svg" width="540" height="211" viewBox="0 0 540 211"><title>单元格与工作表操作</title><rect width="540" height="211" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">单元格与工作表操作</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">工作表可选择、插入、复制、移动、重命名、隐藏、保护和删除</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">删除工作表通常不可用撤销恢复</text><text x="16" y="151" font-size="13" font-weight="700">本组例子</text><rect x="16" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="183" font-size="15" font-weight="400">选择 B 列</text><text x="175" y="184" font-size="14" font-weight="700">→</text><rect x="192" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="183" font-size="15" font-weight="400">插入一列</text><text x="351" y="184" font-size="14" font-weight="700">→</text><rect x="368" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="183" font-size="15" font-weight="400">右侧列顺延</text></g></svg>