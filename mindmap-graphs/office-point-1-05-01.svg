<svg xmlns="http://www.w3.org/2000/svg" width="540" height="251" viewBox="0 0 540 251"><title>页面、分栏、分节、页眉页脚与页码</title><rect width="540" height="251" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">页面、分栏、分节、页眉页脚与页码</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">页面整体设置包括纸张大小、方向、页边距、装订线、页眉页脚距离</text><text x="27" y="81" font-size="15" font-weight="400">、分栏和文档网格</text><rect x="16" y="106" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">课程路径为布局</text><text x="174" y="129" font-size="14" font-weight="700">→</text><rect x="191" y="106" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="128" font-size="15" font-weight="400">页面设置组</text><text x="349" y="129" font-size="14" font-weight="700">→</text><rect x="366" y="106" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="128" font-size="15" font-weight="400">对话框启动器</text><text x="16" y="171" font-size="13" font-weight="700">本组例子</text><rect x="16" y="181" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="203" font-size="15" font-weight="400">第 1 节用纵向纸</text><text x="27" y="223" font-size="15" font-weight="400">张</text><text x="175" y="204" font-size="14" font-weight="700">→</text><rect x="192" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="203" font-size="15" font-weight="400">下一页分节</text><text x="351" y="204" font-size="14" font-weight="700">→</text><rect x="368" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="203" font-size="15" font-weight="400">第 2 节用横向</text></g></svg>