<svg xmlns="http://www.w3.org/2000/svg" width="540" height="184" viewBox="0 0 540 184"><title>数据列表与验证</title><rect width="540" height="184" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">数据列表与验证</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">数据列表按字段和记录组织</text><text x="27" y="78" font-size="15" font-weight="400">列是字段，第一行是列标题，从第二行起每行是一条记录</text><text x="16" y="124" font-size="13" font-weight="700">本组例子</text><rect x="16" y="134" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="156" font-size="15" font-weight="400">分数列设为只允许 0 至 100</text><text x="263" y="157" font-size="14" font-weight="700">→</text><rect x="280" y="134" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="156" font-size="15" font-weight="400">输入 105 时触发提示</text></g></svg>