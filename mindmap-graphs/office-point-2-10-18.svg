<svg xmlns="http://www.w3.org/2000/svg" width="540" height="184" viewBox="0 0 540 184"><title>常用函数</title><rect width="540" height="184" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">常用函数</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">COUNTIF(range,criteria) 统计满足条件的单元格个数</text><text x="16" y="104" font-size="13" font-weight="700">本组例子</text><rect x="16" y="114" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="136" font-size="15" font-weight="400">把 80、90 放进</text><text x="27" y="156" font-size="15" font-weight="400">A1:A2</text><text x="175" y="137" font-size="14" font-weight="700">→</text><rect x="192" y="114" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="136" font-size="15" font-weight="400">=AVERAGE(A1:A2)</text><text x="351" y="137" font-size="14" font-weight="700">→</text><rect x="368" y="114" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="136" font-size="15" font-weight="400">85</text></g></svg>