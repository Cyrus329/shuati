<svg xmlns="http://www.w3.org/2000/svg" width="540" height="251" viewBox="0 0 540 251"><title>页面、分栏、分节、页眉页脚与页码</title><rect width="540" height="251" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">页面、分栏、分节、页眉页脚与页码</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">目录页与正文需要不同页码格式时，先分节，再分别设置页码格式、</text><text x="27" y="81" font-size="15" font-weight="400">起始编号，并按需取消与上一节链接</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">只插入分页符无法独立保存这两套节格式</text><text x="16" y="171" font-size="13" font-weight="700">本组例子</text><rect x="16" y="181" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="203" font-size="15" font-weight="400">第 1 节用纵向纸</text><text x="27" y="223" font-size="15" font-weight="400">张</text><text x="175" y="204" font-size="14" font-weight="700">→</text><rect x="192" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="203" font-size="15" font-weight="400">下一页分节</text><text x="351" y="204" font-size="14" font-weight="700">→</text><rect x="368" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="203" font-size="15" font-weight="400">第 2 节用横向</text></g></svg>