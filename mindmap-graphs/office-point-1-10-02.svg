<svg xmlns="http://www.w3.org/2000/svg" width="540" height="392" viewBox="0 0 540 392"><title>字数统计、校对与修订</title><rect width="540" height="392" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">字数统计、校对与修订</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">课程旧版校对标记</text><text x="27" y="78" font-size="15" font-weight="400">红色波浪线常提示拼写</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">绿色波浪线常提示语法</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">蓝色标记可能提示格式不一致或上下文问题</text><rect x="16" y="200" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="222" font-size="15" font-weight="400">含义随版本与选项变化</text><rect x="16" y="247" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="269" font-size="15" font-weight="400">波浪线是提示，须结合内容判断，不等于自动判错</text><text x="16" y="312" font-size="13" font-weight="700">本组例子</text><rect x="16" y="322" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="344" font-size="15" font-weight="400">将「三月」改为「</text><text x="27" y="364" font-size="15" font-weight="400">四月」</text><text x="175" y="345" font-size="14" font-weight="700">→</text><rect x="192" y="322" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="344" font-size="15" font-weight="400">审阅</text><text x="351" y="345" font-size="14" font-weight="700">→</text><rect x="368" y="322" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="344" font-size="15" font-weight="400">接受修订</text></g></svg>