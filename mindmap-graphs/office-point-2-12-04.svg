<svg xmlns="http://www.w3.org/2000/svg" width="540" height="211" viewBox="0 0 540 211"><title>数据列表与验证</title><rect width="540" height="211" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">数据列表与验证</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">数据验证又称数据有效性，用于制定输入条件以保证数据正确</text><rect x="16" y="86" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">路径为“数据</text><text x="174" y="109" font-size="14" font-weight="700">→</text><rect x="191" y="86" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="108" font-size="15" font-weight="400">数据工具</text><text x="349" y="109" font-size="14" font-weight="700">→</text><rect x="366" y="86" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="108" font-size="15" font-weight="400">数据验证”</text><text x="16" y="151" font-size="13" font-weight="700">本组例子</text><rect x="16" y="161" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="183" font-size="15" font-weight="400">分数列设为只允许 0 至 100</text><text x="263" y="184" font-size="14" font-weight="700">→</text><rect x="280" y="161" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="183" font-size="15" font-weight="400">输入 105 时触发提示</text></g></svg>