<svg xmlns="http://www.w3.org/2000/svg" width="540" height="513" viewBox="0 0 540 513"><title>文本输入、选择、编辑与查找替换</title><rect width="540" height="513" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文本输入、选择、编辑与查找替换</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">课程特殊字符代码</text><text x="27" y="78" font-size="15" font-weight="400">^?任意字符</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">^$任意英文字母</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">^#任意数字</text><rect x="16" y="200" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="222" font-size="15" font-weight="400">^l手动换行符</text><rect x="16" y="247" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="269" font-size="15" font-weight="400">^p段落标记</text><rect x="16" y="294" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="316" font-size="15" font-weight="400">^m手动分页符</text><rect x="16" y="341" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="363" font-size="15" font-weight="400">^t制表符</text><rect x="16" y="388" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="410" font-size="15" font-weight="400">不同查找选项与通配符模式对代码支持可能不同</text><text x="16" y="453" font-size="13" font-weight="700">本组例子</text><rect x="16" y="463" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="485" font-size="15" font-weight="400">「甲｜丙」插入乙</text><text x="263" y="486" font-size="14" font-weight="700">→</text><rect x="280" y="463" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="485" font-size="15" font-weight="400">「甲乙｜丙」</text></g></svg>