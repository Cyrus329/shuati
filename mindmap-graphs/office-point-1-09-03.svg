<svg xmlns="http://www.w3.org/2000/svg" width="540" height="365" viewBox="0 0 540 365"><title>邮件合并、数据源与合并域</title><rect width="540" height="365" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">邮件合并、数据源与合并域</text><rect x="16" y="39" width="113" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">③选择收件人</text><text x="27" y="81" font-size="15" font-weight="400">：邮件</text><text x="130" y="62" font-size="14" font-weight="700">→</text><rect x="147" y="39" width="113" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="158" y="61" font-size="15" font-weight="400">开始邮件合</text><text x="158" y="81" font-size="15" font-weight="400">并</text><text x="261" y="62" font-size="14" font-weight="700">→</text><rect x="278" y="39" width="113" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="289" y="61" font-size="15" font-weight="400">选择收件人</text><text x="392" y="62" font-size="14" font-weight="700">→</text><rect x="409" y="39" width="113" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="420" y="61" font-size="15" font-weight="400">使用现有列</text><text x="420" y="81" font-size="15" font-weight="400">表</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">连接数据源</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">可按任务需要筛选、排序或选择记录</text><rect x="16" y="200" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="219" font-size="13" font-weight="700">④插入合并域</text><text x="27" y="239" font-size="15" font-weight="400">光标定位到变量位置，在编写和插入域→插入合并域中选择字段</text><text x="16" y="285" font-size="13" font-weight="700">本组例子</text><rect x="16" y="295" width="244" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="317" font-size="15" font-weight="400">一张通知模板 + 多行收件人名</text><text x="27" y="337" font-size="15" font-weight="400">单</text><text x="263" y="318" font-size="14" font-weight="700">→</text><rect x="280" y="295" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="317" font-size="15" font-weight="400">每人一份通知</text></g></svg>