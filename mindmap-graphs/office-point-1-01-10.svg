<svg xmlns="http://www.w3.org/2000/svg" width="540" height="258" viewBox="0 0 540 258"><title>文件格式、窗口与视图</title><rect width="540" height="258" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文件格式、窗口与视图</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">导航窗格可以按标题、页面或搜索结果定位</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">使用标题层级需要正确应用标题样式或设置大纲级别</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">仅把文字放大、加粗，不一定会成为导航标题或自动目录项目</text><text x="16" y="198" font-size="13" font-weight="700">本组例子</text><rect x="16" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="230" font-size="15" font-weight="400">论文.docx</text><text x="175" y="231" font-size="14" font-weight="700">→</text><rect x="192" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="230" font-size="15" font-weight="400">打开 Word</text><text x="351" y="231" font-size="14" font-weight="700">→</text><rect x="368" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="230" font-size="15" font-weight="400">在页面上编辑</text></g></svg>