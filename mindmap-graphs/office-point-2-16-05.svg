<svg xmlns="http://www.w3.org/2000/svg" width="540" height="184" viewBox="0 0 540 184"><title>图表</title><rect width="540" height="184" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">图表</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">选中图表后显示“图表工具”，包含“图表设计”和“格式”选项卡，可改</text><text x="27" y="81" font-size="15" font-weight="400">类型、设计和增删数据</text><text x="16" y="124" font-size="13" font-weight="700">本组例子</text><rect x="16" y="134" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="156" font-size="15" font-weight="400">月份放横轴，销量放纵轴</text><text x="263" y="157" font-size="14" font-weight="700">→</text><rect x="280" y="134" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="156" font-size="15" font-weight="400">用折线图看趋势</text></g></svg>