<svg xmlns="http://www.w3.org/2000/svg" width="540" height="211" viewBox="0 0 540 211"><title>文本输入、选择、编辑与查找替换</title><rect width="540" height="211" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文本输入、选择、编辑与查找替换</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">替换前确定查找范围和条件，先检查一个匹配结果，再执行全部替换</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">只改变格式时可以通过格式条件完成，不必把文字删除后重新录入</text><text x="16" y="151" font-size="13" font-weight="700">本组例子</text><rect x="16" y="161" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="183" font-size="15" font-weight="400">「甲｜丙」插入乙</text><text x="263" y="184" font-size="14" font-weight="700">→</text><rect x="280" y="161" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="183" font-size="15" font-weight="400">「甲乙｜丙」</text></g></svg>