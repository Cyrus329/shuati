<svg xmlns="http://www.w3.org/2000/svg" width="540" height="231" viewBox="0 0 540 231"><title>图片、形状、图表与文字环绕</title><rect width="540" height="231" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">图片、形状、图表与文字环绕</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">艺术字</text><text x="27" y="78" font-size="15" font-weight="400">插入→文本→艺术字，输入文字后按绘图对象设置形状、轮廓和效果</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">它与普通正文字符格式的操作方式不同</text><text x="16" y="171" font-size="13" font-weight="700">本组例子</text><rect x="16" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="203" font-size="15" font-weight="400">插入图片</text><text x="175" y="204" font-size="14" font-weight="700">→</text><rect x="192" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="203" font-size="15" font-weight="400">选择四周型</text><text x="351" y="204" font-size="14" font-weight="700">→</text><rect x="368" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="203" font-size="15" font-weight="400">正文绕到图片两侧</text></g></svg>