<svg xmlns="http://www.w3.org/2000/svg" width="540" height="325" viewBox="0 0 540 325"><title>幻灯片放映、计时与录制</title><rect width="540" height="325" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">幻灯片放映、计时与录制</text><rect x="16" y="39" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">放映类型路径：[</text><text x="27" y="81" font-size="15" font-weight="400">幻灯片放映]</text><text x="174" y="62" font-size="14" font-weight="700">→</text><rect x="191" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="61" font-size="15" font-weight="400">[设置]</text><text x="349" y="62" font-size="14" font-weight="700">→</text><rect x="366" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="61" font-size="15" font-weight="400">[设置幻灯片放映]</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">演讲者放映全屏且默认</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">观众自行浏览以窗口方式显示，相当于阅读视图</text><rect x="16" y="200" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="222" font-size="15" font-weight="400">在展台浏览不能手动切换，只能按排练计时或自动换片时间播放</text><text x="16" y="265" font-size="13" font-weight="700">本组例子</text><rect x="16" y="275" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="297" font-size="15" font-weight="400">排练计时记录每页停留时长</text><text x="263" y="298" font-size="14" font-weight="700">→</text><rect x="280" y="275" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="297" font-size="15" font-weight="400">放映时可使用计时</text></g></svg>