<svg xmlns="http://www.w3.org/2000/svg" width="540" height="204" viewBox="0 0 540 204"><title>常用函数</title><rect width="540" height="204" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">常用函数</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">PMT(rate,nper,pv,[fv],[type]) 根据月利率、还款月数和贷款本金</text><text x="27" y="81" font-size="15" font-weight="400">，返回等额分期的每期付款额</text><text x="16" y="124" font-size="13" font-weight="700">本组例子</text><rect x="16" y="134" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="156" font-size="15" font-weight="400">把 80、90 放进</text><text x="27" y="176" font-size="15" font-weight="400">A1:A2</text><text x="175" y="157" font-size="14" font-weight="700">→</text><rect x="192" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="156" font-size="15" font-weight="400">=AVERAGE(A1:A2)</text><text x="351" y="157" font-size="14" font-weight="700">→</text><rect x="368" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="156" font-size="15" font-weight="400">85</text></g></svg>