<svg xmlns="http://www.w3.org/2000/svg" width="540" height="345" viewBox="0 0 540 345"><title>字符和段落格式、样式与模板</title><rect width="540" height="345" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">字符和段落格式、样式与模板</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">五种对齐</text><text x="27" y="78" font-size="15" font-weight="400">左对齐、居中、右对齐、两端对齐、分散对齐</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">课件以两端对齐为默认</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">分散对齐把选定内容均匀分布在一行</text><rect x="16" y="200" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="222" font-size="15" font-weight="400">常用快捷键Ctrl+L左对齐、Ctrl+E居中、Ctrl+R右对齐、Ctrl+J两端</text><text x="27" y="242" font-size="15" font-weight="400">对齐</text><text x="16" y="285" font-size="13" font-weight="700">本组例子</text><rect x="16" y="295" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="317" font-size="15" font-weight="400">把「第一章」应用标题 1</text><text x="263" y="318" font-size="14" font-weight="700">→</text><rect x="280" y="295" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="317" font-size="15" font-weight="400">同时统一字号和层级</text></g></svg>