<svg xmlns="http://www.w3.org/2000/svg" width="540" height="338" viewBox="0 0 540 338"><title>新建、保存、保护与打印</title><rect width="540" height="338" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">新建、保存、保护与打印</text><rect x="16" y="39" width="113" height="100" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">打开密码限</text><text x="27" y="81" font-size="15" font-weight="400">制他人打开</text><text x="27" y="101" font-size="15" font-weight="400">文件，可通</text><text x="27" y="121" font-size="15" font-weight="400">过文件</text><text x="130" y="62" font-size="14" font-weight="700">→</text><rect x="147" y="39" width="113" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="158" y="61" font-size="15" font-weight="400">信息</text><text x="261" y="62" font-size="14" font-weight="700">→</text><rect x="278" y="39" width="113" height="80" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="289" y="61" font-size="15" font-weight="400">保护文档，</text><text x="289" y="81" font-size="15" font-weight="400">或另存为对</text><text x="289" y="101" font-size="15" font-weight="400">话框的工具</text><text x="392" y="62" font-size="14" font-weight="700">→</text><rect x="409" y="39" width="113" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="420" y="61" font-size="15" font-weight="400">常规选项设</text><text x="420" y="81" font-size="15" font-weight="400">置</text><rect x="16" y="146" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="168" font-size="15" font-weight="400">编辑保护通过审阅</text><text x="174" y="169" font-size="14" font-weight="700">→</text><rect x="191" y="146" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="168" font-size="15" font-weight="400">保护</text><text x="349" y="169" font-size="14" font-weight="700">→</text><rect x="366" y="146" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="168" font-size="15" font-weight="400">限制编辑控制允许</text><text x="377" y="188" font-size="15" font-weight="400">的修改范围</text><rect x="16" y="213" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="235" font-size="15" font-weight="400">打开限制和编辑限制作用不同</text><text x="16" y="278" font-size="13" font-weight="700">本组例子</text><rect x="16" y="288" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="310" font-size="15" font-weight="400">原稿.docx</text><text x="175" y="311" font-size="14" font-weight="700">→</text><rect x="192" y="288" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="310" font-size="15" font-weight="400">另存为</text><text x="351" y="311" font-size="14" font-weight="700">→</text><rect x="368" y="288" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="310" font-size="15" font-weight="400">修改稿.docx</text></g></svg>