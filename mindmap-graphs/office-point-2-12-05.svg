<svg xmlns="http://www.w3.org/2000/svg" width="540" height="164" viewBox="0 0 540 164"><title>数据列表与验证</title><rect width="540" height="164" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">数据列表与验证</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">错误警告中只有默认“停止”类型能阻止非法数据录入</text><text x="16" y="104" font-size="13" font-weight="700">本组例子</text><rect x="16" y="114" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="136" font-size="15" font-weight="400">分数列设为只允许 0 至 100</text><text x="263" y="137" font-size="14" font-weight="700">→</text><rect x="280" y="114" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="136" font-size="15" font-weight="400">输入 105 时触发提示</text></g></svg>