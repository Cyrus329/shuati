<svg xmlns="http://www.w3.org/2000/svg" width="540" height="204" viewBox="0 0 540 204"><title>单元格与工作表操作</title><rect width="540" height="204" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">单元格与工作表操作</text><rect x="16" y="39" width="508" height="80" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">保护工作表</text><text x="27" y="78" font-size="15" font-weight="400">工作表标签右键→保护工作表，可设置密码限制他人修改行、列和单元</text><text x="27" y="98" font-size="15" font-weight="400">格等对象</text><text x="16" y="144" font-size="13" font-weight="700">本组例子</text><rect x="16" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="176" font-size="15" font-weight="400">选择 B 列</text><text x="175" y="177" font-size="14" font-weight="700">→</text><rect x="192" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="176" font-size="15" font-weight="400">插入一列</text><text x="351" y="177" font-size="14" font-weight="700">→</text><rect x="368" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="176" font-size="15" font-weight="400">右侧列顺延</text></g></svg>