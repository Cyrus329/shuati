<svg xmlns="http://www.w3.org/2000/svg" width="540" height="231" viewBox="0 0 540 231"><title>分类汇总与合并计算</title><rect width="540" height="231" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">分类汇总与合并计算</text><rect x="16" y="39" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">分类汇总路径：数</text><text x="27" y="81" font-size="15" font-weight="400">据</text><text x="174" y="62" font-size="14" font-weight="700">→</text><rect x="191" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="61" font-size="15" font-weight="400">分级显示</text><text x="349" y="62" font-size="14" font-weight="700">→</text><rect x="366" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="61" font-size="15" font-weight="400">分类汇总</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">先按分类字段排序，再对连续同类记录求和、平均或计数</text><text x="16" y="171" font-size="13" font-weight="700">本组例子</text><rect x="16" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="203" font-size="15" font-weight="400">先按班级排序</text><text x="175" y="204" font-size="14" font-weight="700">→</text><rect x="192" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="203" font-size="15" font-weight="400">分类汇总</text><text x="351" y="204" font-size="14" font-weight="700">→</text><rect x="368" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="203" font-size="15" font-weight="400">每班显示一个小计</text></g></svg>