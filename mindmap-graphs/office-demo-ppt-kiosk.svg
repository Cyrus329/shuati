<svg xmlns="http://www.w3.org/2000/svg" width="540" height="242" viewBox="0 0 540 242"><title>设置放映方式</title><rect width="540" height="242" fill="#e6e9de"/><g fill="#2f4137" font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="16" y="28" font-size="17">设置放映方式</text><rect x="15" y="42" width="510" height="62" rx="4" fill="#e6e9de" stroke="#a3b2a6" /><rect x="23" y="47" width="52" height="24" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="30" y="63" font-size="12">开始</text><rect x="78" y="47" width="52" height="24" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="85" y="63" font-size="12">插入</text><rect x="133" y="47" width="52" height="24" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="140" y="63" font-size="12">设计</text><rect x="188" y="47" width="52" height="24" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="195" y="63" font-size="12">切换</text><rect x="243" y="47" width="52" height="24" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="250" y="63" font-size="12">动画</text><rect x="298" y="47" width="81" height="24" rx="4" fill="#d4e5d7" stroke="#a3b2a6" /><text x="305" y="63" font-size="12">幻灯片放映</text><rect x="382" y="47" width="52" height="24" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="389" y="63" font-size="12">视图</text><rect x="23" y="75" width="104" height="24" rx="4" fill="#d4e5d7" stroke="#a3b2a6" /><text x="30" y="91" font-size="12">设置幻灯片放映</text><rect x="35" y="117" width="470" height="102" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="50" y="143" font-size="13">○ 演讲者放映（全屏）</text><text x="50" y="174" font-size="13">○ 观众自行浏览（窗口）</text><text x="50" y="203" font-size="13">● 在展台浏览（按计时自动换片）</text></g></svg>