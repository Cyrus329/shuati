<svg xmlns="http://www.w3.org/2000/svg" width="540" height="204" viewBox="0 0 540 204"><title>分类汇总与合并计算</title><rect width="540" height="204" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">分类汇总与合并计算</text><rect x="16" y="39" width="508" height="80" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">合并计算路径</text><text x="27" y="78" font-size="15" font-weight="400">数据→数据工具→合并计算，可从多个工作表或工作簿提取数据并汇总</text><text x="27" y="98" font-size="15" font-weight="400">到一个工作表</text><text x="16" y="144" font-size="13" font-weight="700">本组例子</text><rect x="16" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="176" font-size="15" font-weight="400">先按班级排序</text><text x="175" y="177" font-size="14" font-weight="700">→</text><rect x="192" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="176" font-size="15" font-weight="400">分类汇总</text><text x="351" y="177" font-size="14" font-weight="700">→</text><rect x="368" y="154" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="176" font-size="15" font-weight="400">每班显示一个小计</text></g></svg>