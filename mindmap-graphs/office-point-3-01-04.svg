<svg xmlns="http://www.w3.org/2000/svg" width="540" height="184" viewBox="0 0 540 184"><title>PowerPoint 基础、文件格式与视图</title><rect width="540" height="184" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">PowerPoint 基础、文件格式与视图</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">先判断题目考的是文件/视图/设计/动画/放映，再回忆对应对象、作</text><text x="27" y="81" font-size="15" font-weight="400">用和选项卡路径</text><text x="16" y="124" font-size="13" font-weight="700">本组例子</text><rect x="16" y="134" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="156" font-size="15" font-weight="400">普通视图编辑单页</text><text x="263" y="157" font-size="14" font-weight="700">→</text><rect x="280" y="134" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="156" font-size="15" font-weight="400">幻灯片浏览视图查看整套顺序</text></g></svg>