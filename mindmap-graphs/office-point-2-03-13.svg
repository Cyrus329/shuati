<svg xmlns="http://www.w3.org/2000/svg" width="540" height="184" viewBox="0 0 540 184"><title>单元格与工作表操作</title><rect width="540" height="184" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">单元格与工作表操作</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">冻结窗格位于“视图→窗口→冻结窗格”，使指定行、列或单元格对应的</text><text x="27" y="81" font-size="15" font-weight="400">信息在滚动时保持可见</text><text x="16" y="124" font-size="13" font-weight="700">本组例子</text><rect x="16" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="156" font-size="15" font-weight="400">选择 B 列</text><text x="175" y="157" font-size="14" font-weight="700">→</text><rect x="192" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="156" font-size="15" font-weight="400">插入一列</text><text x="351" y="157" font-size="14" font-weight="700">→</text><rect x="368" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="156" font-size="15" font-weight="400">右侧列顺延</text></g></svg>