<svg xmlns="http://www.w3.org/2000/svg" width="540" height="242" viewBox="0 0 540 242"><title>切换看整页，动画看单个对象</title><rect width="540" height="242" fill="#e6e9de"/><g fill="#2f4137" font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="16" y="28" font-size="17">切换看整页，动画看单个对象</text><text x="33" y="60" font-size="14">切换 · 由第 1 页翻到第 2 页</text><rect x="35" y="78" width="90" height="73" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="45" y="98" font-size="13">封面</text><path d="M45 111h70" stroke="#57745f" fill="none" stroke-width="2"/><path d="M45 120h61" stroke="#57745f" fill="none" stroke-width="2"/><path d="M45 129h52" stroke="#57745f" fill="none" stroke-width="2"/><text x="106" y="143" font-size="11">1</text><path d="M132 116h26m-7 -5l7 5-7 5" stroke="#57745f" fill="none" stroke-width="2"/><rect x="164" y="78" width="90" height="73" rx="4" fill="#d4e5d7" stroke="#a3b2a6" /><text x="174" y="98" font-size="13">目录</text><path d="M174 111h70" stroke="#57745f" fill="none" stroke-width="2"/><path d="M174 120h61" stroke="#57745f" fill="none" stroke-width="2"/><path d="M174 129h52" stroke="#57745f" fill="none" stroke-width="2"/><text x="235" y="143" font-size="11">2</text><text x="283" y="60" font-size="14">动画 · 第 2 页上的标题飞入</text><rect x="283" y="78" width="222" height="73" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><path d="M297 116h26m-7 -5l7 5-7 5" stroke="#57745f" fill="none" stroke-width="2"/><rect x="347" y="103" width="120" height="24" rx="4" fill="#d4e5d7" stroke="#a3b2a6" /><text x="354" y="119" font-size="12">① 目录</text></g></svg>