<svg xmlns="http://www.w3.org/2000/svg" width="540" height="278" viewBox="0 0 540 278"><title>图片、形状、图表与文字环绕</title><rect width="540" height="278" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">图片、形状、图表与文字环绕</text><rect x="16" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">插入</text><text x="174" y="62" font-size="14" font-weight="700">→</text><rect x="191" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="61" font-size="15" font-weight="400">插图</text><text x="349" y="62" font-size="14" font-weight="700">→</text><rect x="366" y="39" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="61" font-size="15" font-weight="400">形状可绘制基本图</text><text x="377" y="81" font-size="15" font-weight="400">形、箭头或流程图</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">绘制时按Shift可约束成正圆、正方形等形状</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">SmartArt用于组织层次、流程、关系等可视化信息</text><text x="16" y="218" font-size="13" font-weight="700">本组例子</text><rect x="16" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="250" font-size="15" font-weight="400">插入图片</text><text x="175" y="251" font-size="14" font-weight="700">→</text><rect x="192" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="250" font-size="15" font-weight="400">选择四周型</text><text x="351" y="251" font-size="14" font-weight="700">→</text><rect x="368" y="228" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="250" font-size="15" font-weight="400">正文绕到图片两侧</text></g></svg>