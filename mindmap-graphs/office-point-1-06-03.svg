<svg xmlns="http://www.w3.org/2000/svg" width="540" height="399" viewBox="0 0 540 399"><title>Word 表格、公式与排序</title><rect width="540" height="399" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">Word 表格、公式与排序</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">可插入或删除行、列、单元格</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">平均分布行或列</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">合并单元格</text><rect x="16" y="180" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="202" font-size="15" font-weight="400">拆分单元格</text><rect x="16" y="227" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="249" font-size="15" font-weight="400">拆分表格</text><rect x="16" y="274" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="296" font-size="15" font-weight="400">拆分单元格改变一个区域的行列，拆分表格把一张表分成两张</text><text x="16" y="339" font-size="13" font-weight="700">本组例子</text><rect x="16" y="349" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="371" font-size="15" font-weight="400">姓名、分数</text><text x="175" y="372" font-size="14" font-weight="700">→</text><rect x="192" y="349" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="371" font-size="15" font-weight="400">两列表格</text><text x="351" y="372" font-size="14" font-weight="700">→</text><rect x="368" y="349" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="371" font-size="15" font-weight="400">按分数降序</text></g></svg>