<svg xmlns="http://www.w3.org/2000/svg" width="540" height="305" viewBox="0 0 540 305"><title>新建、保存、保护与打印</title><rect width="540" height="305" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">新建、保存、保护与打印</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">PDF是便于交流、保持版式的电子文档格式</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">课件区分Word 2010导出PDF和Word 2013及以后打开、转换PDF的功能</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">复杂布局和扫描PDF在转换后仍须核对</text><rect x="16" y="180" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="202" font-size="15" font-weight="400">CAJ是中国知网常见格式，课件给出先转PDF再处理的路线</text><text x="16" y="245" font-size="13" font-weight="700">本组例子</text><rect x="16" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="277" font-size="15" font-weight="400">原稿.docx</text><text x="175" y="278" font-size="14" font-weight="700">→</text><rect x="192" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="277" font-size="15" font-weight="400">另存为</text><text x="351" y="278" font-size="14" font-weight="700">→</text><rect x="368" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="277" font-size="15" font-weight="400">修改稿.docx</text></g></svg>