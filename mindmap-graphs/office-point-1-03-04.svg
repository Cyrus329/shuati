<svg xmlns="http://www.w3.org/2000/svg" width="540" height="325" viewBox="0 0 540 325"><title>文本输入、选择、编辑与查找替换</title><rect width="540" height="325" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文本输入、选择、编辑与查找替换</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">Enter插入段落标记，即硬回车</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">Shift+Enter插入手动换行符，即软回车</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">Ctrl+Enter插入分页符</text><rect x="16" y="180" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="202" font-size="15" font-weight="400">换行、分段、分页是不同操作，不能用多次敲空格或回车替代正规排</text><text x="27" y="222" font-size="15" font-weight="400">版</text><text x="16" y="265" font-size="13" font-weight="700">本组例子</text><rect x="16" y="275" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="297" font-size="15" font-weight="400">「甲｜丙」插入乙</text><text x="263" y="298" font-size="14" font-weight="700">→</text><rect x="280" y="275" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="297" font-size="15" font-weight="400">「甲乙｜丙」</text></g></svg>