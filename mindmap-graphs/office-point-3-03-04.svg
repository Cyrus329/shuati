<svg xmlns="http://www.w3.org/2000/svg" width="540" height="211" viewBox="0 0 540 211"><title>母版、版式、主题与背景</title><rect width="540" height="211" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">母版、版式、主题与背景</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">母版作用于统一格式，主题是成套外观方案，背景只处理幻灯片背景</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">三者不能混为一谈</text><text x="16" y="151" font-size="13" font-weight="700">本组例子</text><rect x="16" y="161" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="183" font-size="15" font-weight="400">在母版上放校徽</text><text x="263" y="184" font-size="14" font-weight="700">→</text><rect x="280" y="161" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="183" font-size="15" font-weight="400">使用该母版的版式继承校徽</text></g></svg>