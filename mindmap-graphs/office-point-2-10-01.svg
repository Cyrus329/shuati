<svg xmlns="http://www.w3.org/2000/svg" width="540" height="271" viewBox="0 0 540 271"><title>常用函数</title><rect width="540" height="271" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">常用函数</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">算术函数</text><text x="27" y="78" font-size="15" font-weight="400">ABS、SQRT、MOD、ROUND、INT</text><rect x="16" y="106" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="125" font-size="13" font-weight="700">统计函数</text><text x="27" y="145" font-size="15" font-weight="400">SUM、AVERAGE、MAX、MIN、RANK、COUNT、COUNTA、COUNTBLANK</text><text x="16" y="191" font-size="13" font-weight="700">本组例子</text><rect x="16" y="201" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="223" font-size="15" font-weight="400">把 80、90 放进</text><text x="27" y="243" font-size="15" font-weight="400">A1:A2</text><text x="175" y="224" font-size="14" font-weight="700">→</text><rect x="192" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="223" font-size="15" font-weight="400">=AVERAGE(A1:A2)</text><text x="351" y="224" font-size="14" font-weight="700">→</text><rect x="368" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="223" font-size="15" font-weight="400">85</text></g></svg>