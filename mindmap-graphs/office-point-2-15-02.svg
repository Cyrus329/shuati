<svg xmlns="http://www.w3.org/2000/svg" width="540" height="204" viewBox="0 0 540 204"><title>数据透视表</title><rect width="540" height="204" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">数据透视表</text><rect x="16" y="39" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">数据透视表路径：</text><text x="27" y="81" font-size="15" font-weight="400">插入</text><text x="174" y="62" font-size="14" font-weight="700">→</text><rect x="191" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="61" font-size="15" font-weight="400">表格</text><text x="349" y="62" font-size="14" font-weight="700">→</text><rect x="366" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="61" font-size="15" font-weight="400">数据透视表</text><text x="16" y="124" font-size="13" font-weight="700">本组例子</text><rect x="16" y="134" width="244" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="156" font-size="15" font-weight="400">把班级拖到「行」、分数拖到</text><text x="27" y="176" font-size="15" font-weight="400">「值」</text><text x="263" y="157" font-size="14" font-weight="700">→</text><rect x="280" y="134" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="156" font-size="15" font-weight="400">按班汇总</text></g></svg>