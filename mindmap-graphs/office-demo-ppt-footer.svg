<svg xmlns="http://www.w3.org/2000/svg" width="540" height="242" viewBox="0 0 540 242"><title>应用范围可以是一页或整套</title><rect width="540" height="242" fill="#e6e9de"/><g fill="#2f4137" font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="16" y="28" font-size="17">应用范围可以是一页或整套</text><rect x="36" y="68" width="140" height="83" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="46" y="88" font-size="13">封面</text><path d="M46 101h82" stroke="#57745f" fill="none" stroke-width="2"/><path d="M46 110h73" stroke="#57745f" fill="none" stroke-width="2"/><path d="M46 119h64" stroke="#57745f" fill="none" stroke-width="2"/><text x="157" y="143" font-size="11">1</text><rect x="200" y="68" width="140" height="83" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="210" y="88" font-size="13">活动安排</text><path d="M210 101h82" stroke="#57745f" fill="none" stroke-width="2"/><path d="M210 110h73" stroke="#57745f" fill="none" stroke-width="2"/><path d="M210 119h64" stroke="#57745f" fill="none" stroke-width="2"/><text x="321" y="143" font-size="11">2</text><rect x="364" y="68" width="140" height="83" rx="4" fill="#eeeee5" stroke="#a3b2a6" /><text x="374" y="88" font-size="13">阅读计划</text><path d="M374 101h82" stroke="#57745f" fill="none" stroke-width="2"/><path d="M374 110h73" stroke="#57745f" fill="none" stroke-width="2"/><path d="M374 119h64" stroke="#57745f" fill="none" stroke-width="2"/><text x="485" y="143" font-size="11">3</text><rect x="37" y="167" width="140" height="24" rx="4" fill="#d4e5d7" stroke="#a3b2a6" /><text x="44" y="183" font-size="12">应用：只给当前页编号</text><rect x="199" y="167" width="305" height="24" rx="4" fill="#d4e5d7" stroke="#a3b2a6" /><text x="206" y="183" font-size="12">全部应用：第 1、2、3 页都显示编号</text></g></svg>