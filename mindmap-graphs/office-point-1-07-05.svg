<svg xmlns="http://www.w3.org/2000/svg" width="540" height="231" viewBox="0 0 540 231"><title>图片、形状、图表与文字环绕</title><rect width="540" height="231" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">图片、形状、图表与文字环绕</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">形状格式可设置填充、轮廓、效果及形状内文字</text><rect x="16" y="86" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">多个简单形状可组合为整体，以便移动、缩放或复制，也可取消组合</text><text x="27" y="128" font-size="15" font-weight="400">后分别调整</text><text x="16" y="171" font-size="13" font-weight="700">本组例子</text><rect x="16" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="203" font-size="15" font-weight="400">插入图片</text><text x="175" y="204" font-size="14" font-weight="700">→</text><rect x="192" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="203" font-size="15" font-weight="400">选择四周型</text><text x="351" y="204" font-size="14" font-weight="700">→</text><rect x="368" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="203" font-size="15" font-weight="400">正文绕到图片两侧</text></g></svg>