<svg xmlns="http://www.w3.org/2000/svg" width="540" height="305" viewBox="0 0 540 305"><title>图片、形状、图表与文字环绕</title><rect width="540" height="305" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">图片、形状、图表与文字环绕</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">嵌入式图片类似一个大字符，占据文字中的位置，随所在段落移动</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">课程以嵌入式作为新插入图片的常见默认</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">浮动式对象可设置相对位置和文字环绕</text><rect x="16" y="180" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="202" font-size="15" font-weight="400">绘制形状常浮于文字上方</text><text x="16" y="245" font-size="13" font-weight="700">本组例子</text><rect x="16" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="277" font-size="15" font-weight="400">插入图片</text><text x="175" y="278" font-size="14" font-weight="700">→</text><rect x="192" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="277" font-size="15" font-weight="400">选择四周型</text><text x="351" y="278" font-size="14" font-weight="700">→</text><rect x="368" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="277" font-size="15" font-weight="400">正文绕到图片两侧</text></g></svg>