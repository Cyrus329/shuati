<svg xmlns="http://www.w3.org/2000/svg" width="540" height="345" viewBox="0 0 540 345"><title>字数统计、校对与修订</title><rect width="540" height="345" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">字数统计、校对与修订</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">比较可比较两个Word文档的差异</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">处理多人文档时</text><rect x="16" y="133" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="152" font-size="13" font-weight="700">应区分比较、合并修订与邮件合并</text><text x="27" y="172" font-size="15" font-weight="400">前两者针对编辑差异</text><rect x="16" y="200" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="222" font-size="15" font-weight="400">邮件合并针对同模板多记录输出</text><text x="16" y="265" font-size="13" font-weight="700">本组例子</text><rect x="16" y="275" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="297" font-size="15" font-weight="400">将「三月」改为「</text><text x="27" y="317" font-size="15" font-weight="400">四月」</text><text x="175" y="298" font-size="14" font-weight="700">→</text><rect x="192" y="275" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="297" font-size="15" font-weight="400">审阅</text><text x="351" y="298" font-size="14" font-weight="700">→</text><rect x="368" y="275" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="297" font-size="15" font-weight="400">接受修订</text></g></svg>