<svg xmlns="http://www.w3.org/2000/svg" width="540" height="258" viewBox="0 0 540 258"><title>Word 表格、公式与排序</title><rect width="540" height="258" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">Word 表格、公式与排序</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">表格由行、列组成，交叉处为单元格</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">单元格可输入文字、图片，也能嵌套表格</text><rect x="16" y="133" width="245" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">插入</text><text x="262" y="156" font-size="14" font-weight="700">→</text><rect x="279" y="133" width="245" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="290" y="155" font-size="15" font-weight="400">表格可选择网格或指定行列数</text><text x="16" y="198" font-size="13" font-weight="700">本组例子</text><rect x="16" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="230" font-size="15" font-weight="400">姓名、分数</text><text x="175" y="231" font-size="14" font-weight="700">→</text><rect x="192" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="230" font-size="15" font-weight="400">两列表格</text><text x="351" y="231" font-size="14" font-weight="700">→</text><rect x="368" y="208" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="230" font-size="15" font-weight="400">按分数降序</text></g></svg>