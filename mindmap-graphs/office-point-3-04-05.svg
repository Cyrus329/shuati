<svg xmlns="http://www.w3.org/2000/svg" width="540" height="298" viewBox="0 0 540 298"><title>幻灯片切换与对象动画</title><rect width="540" height="298" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">幻灯片切换与对象动画</text><rect x="16" y="39" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">自定义动画路径：</text><text x="27" y="81" font-size="15" font-weight="400">[动画]</text><text x="174" y="62" font-size="14" font-weight="700">→</text><rect x="191" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="61" font-size="15" font-weight="400">[高级动画]</text><text x="349" y="62" font-size="14" font-weight="700">→</text><rect x="366" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="61" font-size="15" font-weight="400">[添加动画]</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">动画刷可复制动画，双击可连续复制，Esc 取消</text><rect x="16" y="153" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">动画窗格用于查看和调整先后顺序、持续时间、触发方式、延迟和重</text><text x="27" y="195" font-size="15" font-weight="400">复次数</text><text x="16" y="238" font-size="13" font-weight="700">本组例子</text><rect x="16" y="248" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="270" font-size="15" font-weight="400">翻到下一页是切换</text><text x="263" y="271" font-size="14" font-weight="700">→</text><rect x="280" y="248" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="270" font-size="15" font-weight="400">让本页标题飞入是动画</text></g></svg>