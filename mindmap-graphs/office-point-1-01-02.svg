<svg xmlns="http://www.w3.org/2000/svg" width="540" height="546" viewBox="0 0 540 546"><title>文件格式、窗口与视图</title><rect width="540" height="546" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">文件格式、窗口与视图</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">普通Word文档</text><text x="27" y="78" font-size="15" font-weight="400">.docx</text><rect x="16" y="106" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="125" font-size="13" font-weight="700">传统兼容格式</text><text x="27" y="145" font-size="15" font-weight="400">.doc</text><rect x="16" y="173" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="192" font-size="13" font-weight="700">支持宏的文档</text><text x="27" y="212" font-size="15" font-weight="400">.docm</text><rect x="16" y="240" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="259" font-size="13" font-weight="700">普通模板</text><text x="27" y="279" font-size="15" font-weight="400">.dotx</text><rect x="16" y="307" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="326" font-size="13" font-weight="700">支持宏的模板</text><text x="27" y="346" font-size="15" font-weight="400">.dotm</text><rect x="16" y="374" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="396" font-size="15" font-weight="400">默认空白文档基于Normal.dotm</text><rect x="16" y="421" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="443" font-size="15" font-weight="400">扩展名体现文档类型，不等于文件的内容一定正确</text><text x="16" y="486" font-size="13" font-weight="700">本组例子</text><rect x="16" y="496" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="518" font-size="15" font-weight="400">论文.docx</text><text x="175" y="519" font-size="14" font-weight="700">→</tex