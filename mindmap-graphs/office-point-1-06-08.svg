<svg xmlns="http://www.w3.org/2000/svg" width="540" height="231" viewBox="0 0 540 231"><title>Word 表格、公式与排序</title><rect width="540" height="231" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">Word 表格、公式与排序</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">常见公式思路是对上方或左方数据求和、平均，输入公式后检查区域</text><text x="27" y="81" font-size="15" font-weight="400">和结果</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">复制到别处后，按F9更新相应域</text><text x="16" y="171" font-size="13" font-weight="700">本组例子</text><rect x="16" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="203" font-size="15" font-weight="400">姓名、分数</text><text x="175" y="204" font-size="14" font-weight="700">→</text><rect x="192" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="203" font-size="15" font-weight="400">两列表格</text><text x="351" y="204" font-size="14" font-weight="700">→</text><rect x="368" y="181" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="203" font-size="15" font-weight="400">按分数降序</text></g></svg>