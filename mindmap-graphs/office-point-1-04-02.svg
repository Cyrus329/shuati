<svg xmlns="http://www.w3.org/2000/svg" width="540" height="258" viewBox="0 0 540 258"><title>字符和段落格式、样式与模板</title><rect width="540" height="258" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">字符和段落格式、样式与模板</text><rect x="16" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">格式刷：开始</text><text x="174" y="62" font-size="14" font-weight="700">→</text><rect x="191" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="61" font-size="15" font-weight="400">剪贴板</text><text x="349" y="62" font-size="14" font-weight="700">→</text><rect x="366" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="61" font-size="15" font-weight="400">格式刷</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">先选择源格式，再点击格式刷，最后刷目标文字</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">单击使用一次，双击可连续刷多个目标，按Esc或再次单击结束</text><text x="16" y="198" font-size="13" font-weight="700">本组例子</text><rect x="16" y="208" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="230" font-size="15" font-weight="400">把「第一章」应用标题 1</text><text x="263" y="231" font-size="14" font-weight="700">→</text><rect x="280" y="208" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="230" font-size="15" font-weight="400">同时统一字号和层级</text></g></svg>