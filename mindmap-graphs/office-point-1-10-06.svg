<svg xmlns="http://www.w3.org/2000/svg" width="540" height="231" viewBox="0 0 540 231"><title>字数统计、校对与修订</title><rect width="540" height="231" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">字数统计、校对与修订</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">原PDF中的教材页码和历年题号保留在资料转写区</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">这类页码与真题编号属于来源定位信息，不替代知识正文</text><text x="16" y="151" font-size="13" font-weight="700">本组例子</text><rect x="16" y="161" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="183" font-size="15" font-weight="400">将「三月」改为「</text><text x="27" y="203" font-size="15" font-weight="400">四月」</text><text x="175" y="184" font-size="14" font-weight="700">→</text><rect x="192" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="183" font-size="15" font-weight="400">审阅</text><text x="351" y="184" font-size="14" font-weight="700">→</text><rect x="368" y="161" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="183" font-size="15" font-weight="400">接受修订</text></g></svg>