<svg xmlns="http://www.w3.org/2000/svg" width="540" height="345" viewBox="0 0 540 345"><title>新建、保存、保护与打印</title><rect width="540" height="345" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">新建、保存、保护与打印</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">保存</text><text x="27" y="78" font-size="15" font-weight="400">Ctrl+S，将编辑结果写回存储文件</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">首次保存未命名文档时要指定文件名、位置和格式</text><rect x="16" y="153" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="172" font-size="13" font-weight="700">另存为</text><text x="27" y="192" font-size="15" font-weight="400">F12或文件→另存为，可生成新名称、位置或格式的文档</text><rect x="16" y="220" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="242" font-size="15" font-weight="400">A另存为B后，当前编辑文档为B</text><text x="16" y="285" font-size="13" font-weight="700">本组例子</text><rect x="16" y="295" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="317" font-size="15" font-weight="400">原稿.docx</text><text x="175" y="318" font-size="14" font-weight="700">→</text><rect x="192" y="295" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="317" font-size="15" font-weight="400">另存为</text><text x="351" y="318" font-size="14" font-weight="700">→</text><rect x="368" y="295" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="317" font-size="15" font-weight="400">修改稿.docx</text></g></svg>