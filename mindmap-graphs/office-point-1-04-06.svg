<svg xmlns="http://www.w3.org/2000/svg" width="540" height="352" viewBox="0 0 540 352"><title>字符和段落格式、样式与模板</title><rect width="540" height="352" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">字符和段落格式、样式与模板</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">中文版式包括拼音指南、合并字符、双行合一、纵横混排</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">拼音指南在汉字上方添加拼音</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">合并字符最多把6个字符合为一个字符对象</text><rect x="16" y="180" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="202" font-size="15" font-weight="400">双行合一在一行中容纳两行文字</text><rect x="16" y="227" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="249" font-size="15" font-weight="400">纵横混排在横排和竖排之间组合显示</text><text x="16" y="292" font-size="13" font-weight="700">本组例子</text><rect x="16" y="302" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="324" font-size="15" font-weight="400">把「第一章」应用标题 1</text><text x="263" y="325" font-size="14" font-weight="700">→</text><rect x="280" y="302" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="324" font-size="15" font-weight="400">同时统一字号和层级</text></g></svg>