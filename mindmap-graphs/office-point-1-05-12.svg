<svg xmlns="http://www.w3.org/2000/svg" width="540" height="325" viewBox="0 0 540 325"><title>页面、分栏、分节、页眉页脚与页码</title><rect width="540" height="325" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">页面、分栏、分节、页眉页脚与页码</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">域由指令产生动态结果</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">课程给出Ctrl+F9插入域括号、F9更新选定域</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">Ctrl+A后F9常用于刷新正文中选定的域</text><rect x="16" y="180" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="202" font-size="15" font-weight="400">页眉、页脚等其他文本范围需分别检查更新</text><text x="16" y="245" font-size="13" font-weight="700">本组例子</text><rect x="16" y="255" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="277" font-size="15" font-weight="400">第 1 节用纵向纸</text><text x="27" y="297" font-size="15" font-weight="400">张</text><text x="175" y="278" font-size="14" font-weight="700">→</text><rect x="192" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="277" font-size="15" font-weight="400">下一页分节</text><text x="351" y="278" font-size="14" font-weight="700">→</text><rect x="368" y="255" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="277" font-size="15" font-weight="400">第 2 节用横向</text></g></svg>