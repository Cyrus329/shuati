<svg xmlns="http://www.w3.org/2000/svg" width="540" height="345" viewBox="0 0 540 345"><title>页面、分栏、分节、页眉页脚与页码</title><rect width="540" height="345" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">页面、分栏、分节、页眉页脚与页码</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">四类分节符</text><text x="27" y="78" font-size="15" font-weight="400">连续——新节在本页开始</text><rect x="16" y="106" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">下一页——新节从下一页开始</text><rect x="16" y="153" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="175" font-size="15" font-weight="400">奇数页——新节从下一奇数页开始</text><rect x="16" y="200" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="222" font-size="15" font-weight="400">偶数页——新节从下一偶数页开始</text><text x="16" y="265" font-size="13" font-weight="700">本组例子</text><rect x="16" y="275" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="297" font-size="15" font-weight="400">第 1 节用纵向纸</text><text x="27" y="317" font-size="15" font-weight="400">张</text><text x="175" y="298" font-size="14" font-weight="700">→</text><rect x="192" y="275" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="297" font-size="15" font-weight="400">下一页分节</text><text x="351" y="298" font-size="14" font-weight="700">→</text><rect x="368" y="275" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="297" font-size="15" font-weight="400">第 2 节用横向</text></g></svg>