<svg xmlns="http://www.w3.org/2000/svg" width="540" height="352" viewBox="0 0 540 352"><title>新建、保存、保护与打印</title><rect width="540" height="352" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">新建、保存、保护与打印</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">关闭当前文档常用Ctrl+W、Ctrl+F4</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">Alt+F4关闭应用窗口</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">原PDF把Alt+W列在关闭文档一行</text><rect x="16" y="180" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="202" font-size="15" font-weight="400">这与Windows版Word常见的视图选项卡快捷键冲突</text><rect x="16" y="227" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="249" font-size="15" font-weight="400">不应当作通用关闭快捷键</text><text x="16" y="292" font-size="13" font-weight="700">本组例子</text><rect x="16" y="302" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="324" font-size="15" font-weight="400">原稿.docx</text><text x="175" y="325" font-size="14" font-weight="700">→</text><rect x="192" y="302" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="324" font-size="15" font-weight="400">另存为</text><text x="351" y="325" font-size="14" font-weight="700">→</text><rect x="368" y="302" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="324" font-size="15" font-weight="400">修改稿.docx</text></g></svg>