<svg xmlns="http://www.w3.org/2000/svg" width="540" height="291" viewBox="0 0 540 291"><title>邮件合并、数据源与合并域</title><rect width="540" height="291" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">邮件合并、数据源与合并域</text><rect x="16" y="39" width="508" height="80" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">①建立数据源</text><text x="27" y="78" font-size="15" font-weight="400">用Word、Excel或Access等建立二维表，每行对应一条记录，每列字段</text><text x="27" y="98" font-size="15" font-weight="400">如姓名、地址、成绩</text><rect x="16" y="126" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="145" font-size="13" font-weight="700">②建立主文档</text><text x="27" y="165" font-size="15" font-weight="400">保留各份共同的文字和版式，为变量留出位置</text><text x="16" y="211" font-size="13" font-weight="700">本组例子</text><rect x="16" y="221" width="244" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="243" font-size="15" font-weight="400">一张通知模板 + 多行收件人名</text><text x="27" y="263" font-size="15" font-weight="400">单</text><text x="263" y="244" font-size="14" font-weight="700">→</text><rect x="280" y="221" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="243" font-size="15" font-weight="400">每人一份通知</text></g></svg>