<svg xmlns="http://www.w3.org/2000/svg" width="540" height="318" viewBox="0 0 540 318"><title>邮件合并、数据源与合并域</title><rect width="540" height="318" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">邮件合并、数据源与合并域</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="58" font-size="13" font-weight="700">⑤预览结果</text><text x="27" y="78" font-size="15" font-weight="400">逐条检查姓名、称呼、地址、日期、版式及空值</text><rect x="16" y="106" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="125" font-size="13" font-weight="700">⑥完成并合并</text><text x="27" y="145" font-size="15" font-weight="400">输出合并文档、打印或发送</text><rect x="16" y="173" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="195" font-size="15" font-weight="400">合并前的数据源、主文档和最终结果是三种不同对象</text><text x="16" y="238" font-size="13" font-weight="700">本组例子</text><rect x="16" y="248" width="244" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="270" font-size="15" font-weight="400">一张通知模板 + 多行收件人名</text><text x="27" y="290" font-size="15" font-weight="400">单</text><text x="263" y="271" font-size="14" font-weight="700">→</text><rect x="280" y="248" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="270" font-size="15" font-weight="400">每人一份通知</text></g></svg>