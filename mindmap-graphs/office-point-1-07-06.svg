<svg xmlns="http://www.w3.org/2000/svg" width="540" height="251" viewBox="0 0 540 251"><title>图片、形状、图表与文字环绕</title><rect width="540" height="251" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">图片、形状、图表与文字环绕</text><rect x="16" y="39" width="245" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">选中多个可组合的对象，再用</text><text x="27" y="81" font-size="15" font-weight="400">右键</text><text x="262" y="62" font-size="14" font-weight="700">→</text><rect x="279" y="39" width="245" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="290" y="61" font-size="15" font-weight="400">组合</text><rect x="16" y="106" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">需要整体排版图片与文字时，可将文字放在文本框中，并把图片设为</text><text x="27" y="148" font-size="15" font-weight="400">适合组合的非嵌入式，再组合</text><text x="16" y="191" font-size="13" font-weight="700">本组例子</text><rect x="16" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="223" font-size="15" font-weight="400">插入图片</text><text x="175" y="224" font-size="14" font-weight="700">→</text><rect x="192" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="223" font-size="15" font-weight="400">选择四周型</text><text x="351" y="224" font-size="14" font-weight="700">→</text><rect x="368" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="223" font-size="15" font-weight="400">正文绕到图片两侧</text></g></svg>