<svg xmlns="http://www.w3.org/2000/svg" width="540" height="181" viewBox="0 0 540 181"><title>分节后设置两套页码</title><rect width="540" height="181" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="18" y="28" font-size="19" font-weight="700">分节后设置两套页码</text><text x="26" y="56" font-size="15" font-weight="700">要做什么</text><text x="296" y="56" font-size="15" font-weight="700">在 Word 里怎么做</text><rect x="16" y="66" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="66" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="86" font-size="15" font-weight="400">在目录和正文之间分节</text><text x="255" y="86" font-size="18" font-weight="400">→</text><text x="296" y="86" font-size="15" font-weight="400">布局 → 分隔符 → 下一页分节符</text><rect x="16" y="101" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="101" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="121" font-size="15" font-weight="400">目录 i、ii；正文 1、2</text><text x="255" y="121" font-size="18" font-weight="400">→</text><text x="296" y="121" font-size="15" font-weight="400">页脚取消链接 → 分别设置页码</text><rect x="16" y="136" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="136" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="156" font-size="15" font-weight="400">在目录页放置光标</text><text x="255" y="156" font-size="18" font-weight="400">→</text><text x="296" y="156" font-size="15" font-weight="400">引用 → 目录 → 自定义目录</text></g></svg>