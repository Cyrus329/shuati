<svg xmlns="http://www.w3.org/2000/svg" width="540" height="181" viewBox="0 0 540 181"><title>改了什么，就选哪种更新</title><rect width="540" height="181" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="18" y="28" font-size="19" font-weight="700">改了什么，就选哪种更新</text><text x="26" y="56" font-size="15" font-weight="700">正文改动</text><text x="296" y="56" font-size="15" font-weight="700">在「更新目录」里选择</text><rect x="16" y="66" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="66" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="86" font-size="15" font-weight="400">原章节从第 2 页挪到第 5 页</text><text x="255" y="86" font-size="18" font-weight="400">→</text><text x="296" y="86" font-size="15" font-weight="400">只更新页码 · 2 → 5</text><rect x="16" y="101" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="101" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="121" font-size="15" font-weight="400">新增「1.2 计算机应用」</text><text x="255" y="121" font-size="18" font-weight="400">→</text><text x="296" y="121" font-size="15" font-weight="400">更新整个目录 · 加入新条目</text><rect x="16" y="136" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="136" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="156" font-size="15" font-weight="400">标题改名、删除或改了级别</text><text x="255" y="156" font-size="18" font-weight="400">→</text><text x="296" y="156" font-size="15" font-weight="400">更新整个目录 · 同步标题</text></g></svg>