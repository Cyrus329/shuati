<svg xmlns="http://www.w3.org/2000/svg" width="540" height="305" viewBox="0 0 540 305"><title>字符和段落格式、样式与模板</title><rect width="540" height="305" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">字符和段落格式、样式与模板</text><rect x="16" y="39" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">段前、段后控制段落之间的距离</text><rect x="16" y="86" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="108" font-size="15" font-weight="400">段间距和段内行距不同</text><rect x="16" y="133" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="155" font-size="15" font-weight="400">课件中的“自动”段间距按其版本表示一行</text><rect x="16" y="180" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="202" font-size="15" font-weight="400">不要用连续空行代替段前段后设置</text><text x="16" y="245" font-size="13" font-weight="700">本组例子</text><rect x="16" y="255" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="277" font-size="15" font-weight="400">把「第一章」应用标题 1</text><text x="263" y="278" font-size="14" font-weight="700">→</text><rect x="280" y="255" width="244" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="291" y="277" font-size="15" font-weight="400">同时统一字号和层级</text></g></svg>