<svg xmlns="http://www.w3.org/2000/svg" width="540" height="181" viewBox="0 0 540 181"><title>标题样式决定目录缩进</title><rect width="540" height="181" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="18" y="28" font-size="19" font-weight="700">标题样式决定目录缩进</text><text x="26" y="56" font-size="15" font-weight="700">在「开始 → 样式」中设置</text><text x="296" y="56" font-size="15" font-weight="700">目录显示层级</text><rect x="16" y="66" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="66" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="86" font-size="15" font-weight="400">标题 1 · 第 1 章 计算机基础</text><text x="255" y="86" font-size="18" font-weight="400">→</text><text x="296" y="86" font-size="15" font-weight="400">第 1 章 计算机基础 …… 1</text><rect x="16" y="101" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="101" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="121" font-size="15" font-weight="400">标题 2 · 1.1 计算机文化</text><text x="255" y="121" font-size="18" font-weight="400">→</text><text x="296" y="121" font-size="15" font-weight="400">　1.1 计算机文化 …… 2</text><rect x="16" y="136" width="231" height="30" rx="5" fill="#eeeee4" stroke="#a4b3a5"/><rect x="286" y="136" width="238" height="30" rx="5" fill="#e4ebdf" stroke="#a4b3a5"/><text x="26" y="156" font-size="15" font-weight="400">标题 3 · 1.1.1 图灵</text><text x="255" y="156" font-size="18" font-weight="400">→</text><text x="296" y="156" font-size="15" font-weight="400">　　1.1.1 图灵 …… 3</text></g></svg>