<svg xmlns="http://www.w3.org/2000/svg" width="540" height="298" viewBox="0 0 540 298"><title>图片、形状、图表与文字环绕</title><rect width="540" height="298" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">图片、形状、图表与文字环绕</text><rect x="16" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">插入</text><text x="174" y="62" font-size="14" font-weight="700">→</text><rect x="191" y="39" width="157" height="40" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="202" y="61" font-size="15" font-weight="400">符号</text><text x="349" y="62" font-size="14" font-weight="700">→</text><rect x="366" y="39" width="157" height="60" rx="8" fill="#e4ebdf" stroke="#a5b4a5"/><text x="377" y="61" font-size="15" font-weight="400">公式：可插入内置</text><text x="377" y="81" font-size="15" font-weight="400">或自定义公式</text><rect x="16" y="106" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">公式工具的符号组插入数学符号，结构组插入分数、积分、矩阵等结</text><text x="27" y="148" font-size="15" font-weight="400">构</text><rect x="16" y="173" width="508" height="40" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="195" font-size="15" font-weight="400">公式应使用结构编辑器排版，不宜用斜杠和普通字母拼成复杂公式</text><text x="16" y="238" font-size="13" font-weight="700">本组例子</text><rect x="16" y="248" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="270" font-size="15" font-weight="400">插入图片</text><text x="175" y="271" font-size="14" font-weight="700">→</text><rect x="192" y="248" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="270" font-size="15" font-weight="400">选择四周型</text><text x="351" y="271" font-size="14" font-weight="700">→</text><rect x="368" y="248" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="270" font-size="15" font-weight="400">正文绕到图片两侧</text></g></svg>