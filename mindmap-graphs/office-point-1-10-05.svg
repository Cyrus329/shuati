<svg xmlns="http://www.w3.org/2000/svg" width="540" height="271" viewBox="0 0 540 271"><title>字数统计、校对与修订</title><rect width="540" height="271" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">字数统计、校对与修订</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">蓝色森林DOCX的69张卡片和长思维导图保留在本篇下方的逐页文字区</text><text x="27" y="81" font-size="15" font-weight="400">，按原文件顺序阅读</text><rect x="16" y="106" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="128" font-size="15" font-weight="400">内容涵盖视图、窗口、新建与保存、编辑、格式化、表格、页面与审</text><text x="27" y="148" font-size="15" font-weight="400">阅，和上面的71—75结构相互核对</text><text x="16" y="191" font-size="13" font-weight="700">本组例子</text><rect x="16" y="201" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="223" font-size="15" font-weight="400">将「三月」改为「</text><text x="27" y="243" font-size="15" font-weight="400">四月」</text><text x="175" y="224" font-size="14" font-weight="700">→</text><rect x="192" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="223" font-size="15" font-weight="400">审阅</text><text x="351" y="224" font-size="14" font-weight="700">→</text><rect x="368" y="201" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="223" font-size="15" font-weight="400">接受修订</text></g></svg>