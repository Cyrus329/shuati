<svg xmlns="http://www.w3.org/2000/svg" width="540" height="204" viewBox="0 0 540 204"><title>排序与筛选</title><rect width="540" height="204" fill="#e6e9de"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif" fill="#29392f"><text x="16" y="26" font-size="18" font-weight="700">排序与筛选</text><rect x="16" y="39" width="508" height="60" rx="8" fill="#eeeee4" stroke="#a5b4a5"/><text x="27" y="61" font-size="15" font-weight="400">高级筛选条件区域中，同一行的多个条件是逻辑“与”，不同行的条件</text><text x="27" y="81" font-size="15" font-weight="400">是逻辑“或”</text><text x="16" y="124" font-size="13" font-weight="700">本组例子</text><rect x="16" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="27" y="156" font-size="15" font-weight="400">按班级筛选</text><text x="175" y="157" font-size="14" font-weight="700">→</text><rect x="192" y="134" width="156" height="60" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="203" y="156" font-size="15" font-weight="400">只显示指定班；按</text><text x="203" y="176" font-size="15" font-weight="400">分数排序</text><text x="351" y="157" font-size="14" font-weight="700">→</text><rect x="368" y="134" width="156" height="40" rx="8" fill="#dce7da" stroke="#a5b4a5"/><text x="379" y="156" font-size="15" font-weight="400">改变行顺序</text></g></svg>