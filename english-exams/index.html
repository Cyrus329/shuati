<header><a href="../index.html">返回个人学习册</a><h1>英语套卷</h1></header>
<main>
<section id="catalog"><label>找试卷 <input id="search" type="search" placeholder="输入年份或卷名"></label><div class="shelves"><nav id="seriesNav" aria-label="试卷系列"></nav><nav id="difficultyNav" aria-label="难度筛选"></nav><div id="papers"></div></div></section>
<section id="exam" hidden>
<div class="actions"><button id="back">返回卷库</button><a id="original" target="_blank" rel="noopener">打开原试卷 PDF</a></div>
<h2 id="title"></h2>
<div id="controls" class="actions"><button id="start">开始考试</button><output id="clock">02:00:00</output><button id="finish" hidden>交卷</button><span id="status" role="status"></span></div>
<p id="info"></p>
<div class="work">
<div class="exam-paper"><div id="singleQuestion" hidden><aside class="question-index"><h3>题号</h3><nav id="questionNav" aria-label="题号"></nav></aside><article id="questionBody"></article><div class="actions"><button id="prevQuestion">上一题</button><button id="markQuestion" type="button" hidden>标记本题</button><button id="nextQuestion">下一题</button></div></div><iframe id="viewer" title="试卷 PDF"></iframe></div>
<section id="response" hidden>
<h3>答题区</h3>
<label>题号 <input id="number" value="1" maxlength="24"></label>
<label>作答 <textarea id="answer" rows="8" aria-label="作答"></textarea></label>
<button id="saveAnswer">保存本题</button>
<div id="saved"></div>
<p id="feedback" role="status"></p>
</section>
</div>
<section id="review" hidden><h3>答案与解析</h3><a id="solutions" target="_blank" rel="noopener">打开原参考资料</a><p id="pending" hidden>暂无单独配对的参考资料，逐题解析待补。</p><p id="scoreSummary" role="status" hidden></p><div id="questionSolutions"></div></section>
</section>
</main>
</body>
