<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语逐题精讲</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="editorial.css"><link rel="stylesheet" href="english-lesson.css"><style>body{margin:0;padding:24px;background:var(--soft);color:var(--ink)}main{max-width:960px;margin:auto}h1{font-size:clamp(26px,5vw,42px)}.tools{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.tools input{flex:1;min-width:180px}.tools input,.tools select,button{font:inherit;padding:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}.question{background:var(--paper);border:1px solid var(--line);margin:16px 0;padding:20px;overflow-wrap:anywhere}.question>summary{cursor:pointer;line-height:1.8}.question small{display:block;color:var(--muted)}.original{line-height:1.9;white-space:pre-wrap}nav{display:flex;gap:16px;align-items:center;justify-content:center;margin:24px 0}a{color:var(--accent)}@media(max-width:600px){body{padding:12px}.question{padding:14px}.tools{display:grid}.tools input{min-width:0;width:100%;box-sizing:border-box}}</style></head>
